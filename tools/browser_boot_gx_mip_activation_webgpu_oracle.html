<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Lazuli GX mip activation WebGPU oracle</title>
  <style>
    :root {
      color-scheme: dark;
      font: 14px/1.5 ui-monospace, monospace;
      background: #0b0c0f;
      color: #f1f3f5;
    }
    body {
      margin: 2rem;
    }
    canvas {
      width: 64px;
      height: 64px;
      image-rendering: pixelated;
      border: 1px solid #59636e;
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
</head>
<body data-status="running">
  <h1>Lazuli GX mip activation WebGPU oracle</h1>
  <canvas id="oracle" width="4" height="4"></canvas>
  <pre id="result">running</pre>
  <script type="module">
    import init, {
      WebGpuRenderer,
    } from "../target/gekko-web/browser_renderer.js";
    import {
      buildGxMipActivationOraclePacket,
      gxMipActivationOracle,
    } from "./browser_boot_gx_mip_activation_oracle.mjs";

    function resourceMetrics(diagnostics) {
      return {
        gxFramePacketPayloadBytes:
          diagnostics.gxFramePacketPayloadBytes,
        texturePixelBytes: diagnostics.texturePixelBytes,
        textureUploadBytes: diagnostics.textureUploadBytes,
        textureWrites: diagnostics.textureWrites,
      };
    }

    function subtractMetrics(after, before) {
      return Object.fromEntries(
        Object.keys(after).map(key => [key, after[key] - before[key]]),
      );
    }

    function exactUploadMetrics(actual, expected) {
      return (
        actual.gxFramePacketPayloadBytes ===
          expected.packetPayloadBytes &&
        actual.texturePixelBytes === expected.packetPayloadBytes &&
        actual.textureUploadBytes === expected.textureUploadBytes &&
        actual.textureWrites === expected.textureWrites
      );
    }

    function exactNamespacedAcknowledgement(keys) {
      return (
        keys.length === 1 &&
        keys[0] === gxMipActivationOracle.key &&
        keys[0] ===
          `${gxMipActivationOracle.legacyKey}`
            + gxMipActivationOracle.keySuffix
      );
    }

    function exactZeroRejectionDiagnostics(diagnostics) {
      return (
        diagnostics.exactRequiredRejectedDraws === 0 &&
        Object.values(
          diagnostics.exactRequiredRejectionReasons,
        ).every(value => value === 0)
      );
    }

    function traceCanvasContextRequests(canvas) {
      const requests = [];
      const original = canvas.getContext;
      canvas.getContext = function getContext(type, ...options) {
        requests.push(String(type));
        return Reflect.apply(original, this, [type, ...options]);
      };
      return Object.freeze({
        requests,
        restore() {
          delete canvas.getContext;
        },
      });
    }

    async function run() {
      await init();
      const canvas = document.querySelector("#oracle");
      const contextTrace = traceCanvasContextRequests(canvas);
      let renderer;
      try {
        renderer = await WebGpuRenderer.create(canvas);
      } finally {
        contextTrace.restore();
      }
      renderer.reset_diagnostics();
      try {
        const firstPacket =
          buildGxMipActivationOraclePacket({ resident: false });
        const beforeFirst = resourceMetrics(renderer.diagnostics());
        const firstAcknowledgedKeys = Array.from(
          renderer.submit_gx_frame(firstPacket),
        );
        await renderer.drain();
        renderer.check_health();
        const afterFirst = resourceMetrics(renderer.diagnostics());
        const firstMetricDelta = subtractMetrics(
          afterFirst,
          beforeFirst,
        );
        const firstAcknowledgementExact =
          exactNamespacedAcknowledgement(firstAcknowledgedKeys);
        const firstMetricsExact = exactUploadMetrics(
          firstMetricDelta,
          gxMipActivationOracle.expectedFirstUpload,
        );

        const residentPacket =
          buildGxMipActivationOraclePacket({ resident: true });
        const beforeResident = resourceMetrics(renderer.diagnostics());
        const residentAcknowledgedKeys = Array.from(
          renderer.submit_gx_frame(residentPacket),
        );
        await renderer.drain();
        renderer.check_health();
        const afterResident = resourceMetrics(renderer.diagnostics());
        const residentMetricDelta = subtractMetrics(
          afterResident,
          beforeResident,
        );
        const residentAcknowledgementExact =
          exactNamespacedAcknowledgement(residentAcknowledgedKeys);
        const residentMetricsExact = exactUploadMetrics(
          residentMetricDelta,
          gxMipActivationOracle.expectedResidentUpload,
        );

        const unexpectedCanvasContexts =
          contextTrace.requests.filter(type => type !== "webgpu");
        const backendDiagnostics = {
          renderer: "WebGpuRenderer",
          navigatorGpuAvailable:
            typeof navigator.gpu?.requestAdapter === "function",
          canvasContextRequests: [...contextTrace.requests],
          unexpectedCanvasContexts,
          strictWebGpuOnly:
            contextTrace.requests.length > 0 &&
            unexpectedCanvasContexts.length === 0 &&
            contextTrace.requests.every(type => type === "webgpu"),
        };
        const diagnostics = renderer.diagnostics();
        const synchronizationExact =
          diagnostics.submitGxFrameCalls === 2 &&
          diagnostics.drainCalls === 2 &&
          diagnostics.checkHealthCalls === 2;
        const diagnosticsClean =
          exactZeroRejectionDiagnostics(diagnostics);
        const packetContractExact =
          new DataView(
            firstPacket.buffer,
            firstPacket.byteOffset,
            firstPacket.byteLength,
          ).getUint16(0x04, true) ===
            gxMipActivationOracle.packetVersion &&
          new DataView(
            residentPacket.buffer,
            residentPacket.byteOffset,
            residentPacket.byteLength,
          ).getUint16(0x04, true) ===
            gxMipActivationOracle.packetVersion;
        const result = {
          pass:
            backendDiagnostics.navigatorGpuAvailable &&
            backendDiagnostics.strictWebGpuOnly &&
            packetContractExact &&
            firstAcknowledgementExact &&
            firstMetricsExact &&
            residentAcknowledgementExact &&
            residentMetricsExact &&
            synchronizationExact &&
            diagnosticsClean,
          identity: {
            legacyKey: gxMipActivationOracle.legacyKey,
            namespacedKey: gxMipActivationOracle.key,
            exactSuffix: gxMipActivationOracle.keySuffix,
            suffixRoundTrip:
              firstAcknowledgedKeys[0] === gxMipActivationOracle.key &&
              residentAcknowledgedKeys[0] === gxMipActivationOracle.key,
            width: gxMipActivationOracle.width,
            height: gxMipActivationOracle.height,
            mipLevelCount: gxMipActivationOracle.mipLevelCount,
          },
          packetContractExact,
          first: {
            packetBytes: firstPacket.byteLength,
            acknowledgedKeys: firstAcknowledgedKeys,
            acknowledgementExact: firstAcknowledgementExact,
            expectedMetrics:
              gxMipActivationOracle.expectedFirstUpload,
            metricDelta: firstMetricDelta,
            metricsExact: firstMetricsExact,
          },
          resident: {
            packetBytes: residentPacket.byteLength,
            acknowledgedKeys: residentAcknowledgedKeys,
            acknowledgementExact: residentAcknowledgementExact,
            expectedMetrics:
              gxMipActivationOracle.expectedResidentUpload,
            metricDelta: residentMetricDelta,
            metricsExact: residentMetricsExact,
          },
          backendDiagnostics,
          synchronizationExact,
          diagnosticsClean,
          diagnostics,
          health: "clean",
        };
        document.body.dataset.status = result.pass ? "pass" : "fail";
        document.querySelector("#result").textContent =
          JSON.stringify(result, null, 2);
        return result;
      } finally {
        renderer.free();
      }
    }

    window.__lazuliGxMipActivationOraclePromise = run().catch(error => {
      const result = {
        pass: false,
        error: error instanceof Error ? error.stack : String(error),
      };
      document.body.dataset.status = "error";
      document.querySelector("#result").textContent =
        JSON.stringify(result, null, 2);
      return result;
    });
  </script>
</body>
</html>
