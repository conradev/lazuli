<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Lazuli early-Z WebGPU oracle</title>
  <style>
    :root {
      color-scheme: dark;
      font: 14px/1.5 ui-monospace, monospace;
      background: #0b0c0f;
      color: #f1f3f5;
    }
    body {
      margin: 2rem;
    }
    canvas {
      width: 64px;
      height: 64px;
      image-rendering: pixelated;
      border: 1px solid #59636e;
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
</head>
<body data-status="running">
  <h1>Lazuli early-Z WebGPU oracle</h1>
  <canvas id="oracle" width="4" height="4"></canvas>
  <pre id="result">running</pre>
  <script type="module">
    import init, {
      WebGpuRenderer,
    } from "../target/gekko-web/browser_renderer.js";
    import {
      buildEarlyZOraclePacket,
      earlyZOracleCases,
      earlyZOracleXfb,
    } from "./browser_boot_early_z_oracle.mjs";

    async function run() {
      await init();
      const canvas = document.querySelector("#oracle");
      const renderer = await WebGpuRenderer.create(canvas);
      renderer.reset_diagnostics();
      const cases = [];
      try {
        for (let index = 0; index < earlyZOracleCases.length; index += 1) {
          const entry = earlyZOracleCases[index];
          const generation = index + 1;
          renderer.reset();
          renderer.submit_gx_frame(
            buildEarlyZOraclePacket(entry.draws, generation),
          );
          const presentation = renderer.present_xfb(
            earlyZOracleXfb.destination,
            generation,
            0,
            "progressive",
            "top",
            generation,
            earlyZOracleXfb.width,
            earlyZOracleXfb.height,
            earlyZOracleXfb.stride,
            earlyZOracleXfb.height,
            1,
            false,
            false,
          );
          await renderer.drain();
          const readback = await renderer.read_presented_xfb_rgba();
          const rgba = Array.from(readback.rgba);
          const center = (
            Math.floor(earlyZOracleXfb.height / 2) *
              earlyZOracleXfb.width +
            Math.floor(earlyZOracleXfb.width / 2)
          ) * 4;
          const actual = rgba.slice(center, center + 4);
          cases.push({
            name: entry.name,
            expected: entry.expected,
            actual,
            pass: actual.every(
              (value, channel) => value === entry.expected[channel],
            ),
            width: readback.width,
            height: readback.height,
            presentation,
          });
          renderer.check_health();
        }
        const result = {
          pass: cases.every(entry => entry.pass),
          cases,
          diagnostics: renderer.diagnostics(),
          health: "clean",
        };
        document.body.dataset.status = result.pass ? "pass" : "fail";
        document.querySelector("#result").textContent =
          JSON.stringify(result, null, 2);
        return result;
      } finally {
        renderer.free();
      }
    }

    window.__lazuliEarlyZOraclePromise = run().catch(error => {
      const result = {
        pass: false,
        error: error instanceof Error ? error.stack : String(error),
      };
      document.body.dataset.status = "error";
      document.querySelector("#result").textContent =
        JSON.stringify(result, null, 2);
      return result;
    });
  </script>
</body>
</html>
