<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <meta name="robots" content="noindex,nofollow">
  <title>Lazuli XF clip-disable guardband WebGPU oracle</title>
  <style>
    :root {
      color-scheme: dark;
      font: 14px/1.5 ui-monospace, monospace;
      background: #0b0c0f;
      color: #f1f3f5;
    }
    body {
      margin: 2rem;
    }
    canvas {
      width: 256px;
      height: 256px;
      image-rendering: pixelated;
      border: 1px solid #59636e;
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
</head>
<body data-status="running">
  <h1>Lazuli XF clip-disable guardband WebGPU oracle</h1>
  <canvas id="oracle" width="16" height="16"></canvas>
  <pre id="result">running</pre>
  <script type="module">
    import init, {
      WebGpuRenderer,
    } from "../target/gekko-web/browser_renderer.js";
    import {
      CLIP_DISABLE_GUARDBAND_MODES,
      CLIP_DISABLE_GUARDBAND_RUN_COUNT,
      CLIP_DISABLE_GUARDBAND_SCOPE,
      buildClipDisableGuardbandOraclePacket,
      clipDisableGuardbandCases,
      clipDisableGuardbandCertificationMatrix,
      clipDisableGuardbandOracleXfb,
      evaluateClipDisableGuardband,
    } from "./browser_boot_clip_disable_guardband_oracle.mjs";

    const LOOPBACK_HOSTS = new Set([
      "127.0.0.1",
      "localhost",
      "::1",
    ]);
    const EXPECTED_MATRIX_ENTRIES = 160;
    const RESULT_SCHEMA =
      "lazuli.clip-disable-guardband.webgpu.v1";

    function requireLocalDebugOrigin() {
      if (!LOOPBACK_HOSTS.has(window.location.hostname)) {
        throw new Error(
          "the XF guardband WebGPU oracle is localhost debug-only",
        );
      }
    }

    function exactCounterMap(actual, expected) {
      const actualKeys = Object.keys(actual).sort();
      const expectedKeys = Object.keys(expected).sort();
      return (
        actualKeys.length === expectedKeys.length &&
        actualKeys.every(
          (key, index) =>
            key === expectedKeys[index] &&
            actual[key] === expected[key],
        )
      );
    }

    function zeroCounterMap(source) {
      return Object.fromEntries(
        Object.keys(source).map((key) => [key, 0]),
      );
    }

    async function present(renderer, generation) {
      const presentation = renderer.present_xfb(
        clipDisableGuardbandOracleXfb.destination,
        generation,
        0,
        "progressive",
        "top",
        generation,
        clipDisableGuardbandOracleXfb.width,
        clipDisableGuardbandOracleXfb.height,
        clipDisableGuardbandOracleXfb.stride,
        clipDisableGuardbandOracleXfb.height,
        1,
        false,
        false,
      );
      await renderer.drain();
      const readback = await renderer.read_presented_xfb_rgba();
      renderer.check_health();
      return { presentation, readback };
    }

    async function run() {
      requireLocalDebugOrigin();
      if (!("gpu" in navigator)) {
        throw new Error("WebGPU is required by the strict guardband oracle");
      }
      await init();
      const canvas = document.querySelector("#oracle");
      const renderer = await WebGpuRenderer.create(canvas);
      renderer.reset_diagnostics();
      const matrix = clipDisableGuardbandCertificationMatrix();
      const caseResults = [];
      let presentationCount = 0;
      let readbackCount = 0;
      try {
        for (const entry of matrix) {
          renderer.reset();
          const before = renderer.diagnostics();
          renderer.submit_gx_frame(
            buildClipDisableGuardbandOraclePacket(
              entry.caseId,
              entry.mode,
              entry.generation,
            ),
          );
          const surface = await present(renderer, entry.generation);
          presentationCount += 1;
          readbackCount += 1;
          const after = renderer.diagnostics();
          caseResults.push({
            ...evaluateClipDisableGuardband(
              entry.caseId,
              entry.mode,
              before,
              after,
              surface.readback,
            ),
            run: entry.run,
            generation: entry.generation,
            presentation: surface.presentation,
          });
        }

        renderer.check_health();
        const diagnostics = renderer.diagnostics();
        const expectations = matrix.map(
          (entry) => entry.expectation,
        );
        const expectedManagedCoverage = expectations.reduce(
          (total, entry) =>
            total + entry.expectedManagedCoverage.draws,
          0,
        );
        const expectedManagedTriangles = expectations.reduce(
          (total, entry) =>
            total + entry.expectedManagedCoverage.triangles,
          0,
        );
        const expectedExactRasterEmptyDraws = expectations.reduce(
          (total, entry) =>
            total + entry.expectedExactRasterEmptyDraws,
          0,
        );
        const expectedExactRequiredRejectedDraws =
          expectations.reduce(
            (total, entry) =>
              total + entry.expectedRejection.aggregate,
            0,
          );
        const expectedPushTevDrawCalls = expectations.reduce(
          (total, entry) =>
            total + entry.expectedPushTevDrawCalls,
          0,
        );
        const expectedSubmitGxFrameCalls = expectations.reduce(
          (total, entry) =>
            total + entry.expectedSubmitGxFrameCalls,
          0,
        );
        const expectedRejectionReasons = zeroCounterMap(
          diagnostics.exactRequiredRejectionReasons,
        );
        const expectedPreparationRejectionReasons = zeroCounterMap(
          diagnostics.exactRequiredPreparationRejectionReasons,
        );
        expectedRejectionReasons.exactPreparation =
          expectedExactRequiredRejectedDraws;
        for (const entry of expectations) {
          const reason = entry.expectedRejection.preparationReason;
          if (reason !== null) {
            if (
              !Object.hasOwn(
                expectedPreparationRejectionReasons,
                reason,
              )
            ) {
              throw new Error(
                `renderer omitted guardband rejection counter ${reason}`,
              );
            }
            expectedPreparationRejectionReasons[reason] += 1;
          }
        }

        const expectedEntriesPerRun =
          clipDisableGuardbandCases.length *
          CLIP_DISABLE_GUARDBAND_MODES.length;
        const runs = Array.from(
          { length: CLIP_DISABLE_GUARDBAND_RUN_COUNT },
          (_unused, index) => {
            const run = index + 1;
            const cases = caseResults.filter(
              (entry) => entry.run === run,
            );
            return {
              index: run,
              pass:
                cases.length === expectedEntriesPerRun &&
                cases.every((entry) => entry.pass),
              cases,
            };
          },
        );
        const matrixCardinalityExact =
          matrix.length === EXPECTED_MATRIX_ENTRIES &&
          matrix.length ===
            expectedEntriesPerRun *
              CLIP_DISABLE_GUARDBAND_RUN_COUNT &&
          caseResults.length === matrix.length &&
          presentationCount === matrix.length &&
          readbackCount === matrix.length;
        const aggregateCountersExact =
          diagnostics.exactRequiredRejectedDraws ===
            expectedExactRequiredRejectedDraws &&
          exactCounterMap(
            diagnostics.exactRequiredRejectionReasons,
            expectedRejectionReasons,
          ) &&
          exactCounterMap(
            diagnostics.exactRequiredPreparationRejectionReasons,
            expectedPreparationRejectionReasons,
          ) &&
          diagnostics.managedCoverageDraws ===
            expectedManagedCoverage &&
          diagnostics.managedCoverageTriangles ===
            expectedManagedTriangles &&
          diagnostics.exactRasterEmptyDraws ===
            expectedExactRasterEmptyDraws &&
          diagnostics.pushTevDrawCalls ===
            expectedPushTevDrawCalls &&
          diagnostics.submitGxFrameCalls ===
            expectedSubmitGxFrameCalls;
        const result = {
          pass:
            runs.every((entry) => entry.pass) &&
            matrixCardinalityExact &&
            aggregateCountersExact,
          schema: RESULT_SCHEMA,
          strictWebGpu: true,
          localhostOnly: true,
          scope: CLIP_DISABLE_GUARDBAND_SCOPE,
          runCount: CLIP_DISABLE_GUARDBAND_RUN_COUNT,
          modes: CLIP_DISABLE_GUARDBAND_MODES,
          caseIds: clipDisableGuardbandCases.map(
            (entry) => entry.id,
          ),
          matrixEntries: matrix.length,
          presentationCount,
          readbackCount,
          matrixCardinalityExact,
          expectedManagedCoverage,
          expectedManagedTriangles,
          expectedExactRasterEmptyDraws,
          expectedExactRequiredRejectedDraws,
          expectedPushTevDrawCalls,
          expectedSubmitGxFrameCalls,
          expectedRejectionReasons,
          expectedPreparationRejectionReasons,
          aggregateCountersExact,
          runs,
          diagnostics,
          health: "clean",
        };
        document.body.dataset.status = result.pass ? "pass" : "fail";
        document.querySelector("#result").textContent =
          JSON.stringify(result, null, 2);
        return result;
      } finally {
        renderer.free();
      }
    }

    window.__lazuliClipDisableGuardbandOraclePromise =
      run().catch((error) => {
        const result = {
          pass: false,
          schema: RESULT_SCHEMA,
          strictWebGpu: true,
          localhostOnly: true,
          scope: CLIP_DISABLE_GUARDBAND_SCOPE,
          health: "error",
          error: error instanceof Error ? error.stack : String(error),
        };
        document.body.dataset.status = "error";
        document.querySelector("#result").textContent =
          JSON.stringify(result, null, 2);
        return result;
      });
  </script>
</body>
</html>
