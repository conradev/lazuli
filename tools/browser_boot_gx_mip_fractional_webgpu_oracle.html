<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Lazuli GX fractional mip WebGPU oracle</title>
  <style>
    :root {
      color-scheme: dark;
      font: 14px/1.5 ui-monospace, monospace;
      background: #0b0c0f;
      color: #f1f3f5;
    }
    body {
      margin: 2rem;
    }
    canvas {
      width: 64px;
      height: 64px;
      image-rendering: pixelated;
      border: 1px solid #59636e;
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
</head>
<body data-status="running">
  <h1>Lazuli GX fractional mip WebGPU oracle</h1>
  <canvas id="oracle" width="4" height="4"></canvas>
  <pre id="result">running</pre>
  <script type="module">
    import init, {
      WebGpuRenderer,
    } from "../target/gekko-web/browser_renderer.js";
    import {
      buildGxMipFractionalOraclePacket,
      gxMipFractionalOracle,
      gxMipFractionalOracleCases,
    } from "./browser_boot_gx_mip_fractional_oracle.mjs";

    const RUN_COUNT = 2;

    function bytesEqual(actual, expected) {
      return (
        actual.length === expected.length &&
        actual.every((value, index) => value === expected[index])
      );
    }

    function fnv1a64Hex(bytes) {
      let hash = 0xcbf29ce484222325n;
      for (const byte of bytes) {
        hash ^= BigInt(byte);
        hash = BigInt.asUintN(
          64,
          hash * 0x100000001b3n,
        );
      }
      return `0x${hash.toString(16).padStart(16, "0")}`;
    }

    function probePixel(rgba, width, probe) {
      const offset = (probe.y * width + probe.x) * 4;
      return rgba.slice(offset, offset + 4);
    }

    function rendererMetrics(diagnostics) {
      return {
        gxFramePacketPayloadBytes:
          diagnostics.gxFramePacketPayloadBytes,
        texturePixelBytes: diagnostics.texturePixelBytes,
        textureUploadBytes: diagnostics.textureUploadBytes,
        textureWrites: diagnostics.textureWrites,
        managedCoverageDraws: diagnostics.managedCoverageDraws,
        managedCoverageTriangles:
          diagnostics.managedCoverageTriangles,
      };
    }

    function subtractMetrics(after, before) {
      return Object.fromEntries(
        Object.keys(after).map(key => [key, after[key] - before[key]]),
      );
    }

    function exactMetrics(actual, expected) {
      return (
        actual.gxFramePacketPayloadBytes ===
          expected.packetPayloadBytes &&
        actual.texturePixelBytes === expected.packetPayloadBytes &&
        actual.textureUploadBytes === expected.textureUploadBytes &&
        actual.textureWrites === expected.textureWrites &&
        actual.managedCoverageDraws ===
          expected.managedCoverageDraws &&
        actual.managedCoverageTriangles ===
          expected.managedCoverageTriangles
      );
    }

    function traceCanvasContextRequests(canvas) {
      const requests = [];
      const original = canvas.getContext;
      canvas.getContext = function getContext(type, ...options) {
        requests.push(String(type));
        return Reflect.apply(original, this, [type, ...options]);
      };
      return Object.freeze({
        requests,
        restore() {
          delete canvas.getContext;
        },
      });
    }

    async function run() {
      await init();
      const canvas = document.querySelector("#oracle");
      const contextTrace = traceCanvasContextRequests(canvas);
      let renderer;
      try {
        renderer = await WebGpuRenderer.create(canvas);
      } finally {
        contextTrace.restore();
      }
      renderer.reset_diagnostics();
      const runs = [];
      const firstReadbacks = new Map();
      try {
        for (let runIndex = 0; runIndex < RUN_COUNT; runIndex += 1) {
          const cases = [];
          for (
            let caseIndex = 0;
            caseIndex < gxMipFractionalOracleCases.length;
            caseIndex += 1
          ) {
            const entry = gxMipFractionalOracleCases[caseIndex];
            const generation =
              runIndex * gxMipFractionalOracleCases.length + caseIndex + 1;
            renderer.reset();
            const diagnosticsBefore = rendererMetrics(
              renderer.diagnostics(),
            );
            const acknowledgedKeys = Array.from(
              renderer.submit_gx_frame(
                buildGxMipFractionalOraclePacket(
                  entry.lodSixteenths,
                  generation,
                ),
              ),
            );
            const presentation = renderer.present_xfb(
              gxMipFractionalOracle.xfb.destination,
              generation,
              0,
              "progressive",
              "top",
              generation,
              gxMipFractionalOracle.xfb.width,
              gxMipFractionalOracle.xfb.height,
              gxMipFractionalOracle.xfb.stride,
              gxMipFractionalOracle.xfb.height,
              1,
              false,
            );
            await renderer.drain();
            const readback = await renderer.read_presented_xfb_rgba();
            renderer.check_health();
            const actualRgba = Array.from(readback.rgba);
            const actualProbeRgba = probePixel(
              actualRgba,
              readback.width,
              gxMipFractionalOracle.probe,
            );
            const actualRgbaFnv1a64 = fnv1a64Hex(actualRgba);
            const prior = firstReadbacks.get(entry.id);
            const deterministic =
              prior === undefined || bytesEqual(actualRgba, prior);
            if (prior === undefined) {
              firstReadbacks.set(entry.id, actualRgba);
            }
            const byteExact = bytesEqual(
              actualRgba,
              entry.expectedRgba,
            );
            const probeExact = bytesEqual(
              actualProbeRgba,
              entry.expectedProbeRgba,
            );
            const hashExact =
              actualRgbaFnv1a64 === entry.expectedRgbaFnv1a64;
            const coverageDiscriminatorExact =
              actualRgbaFnv1a64 !==
                entry.nonUniformCoverageComparisonRgbaFnv1a64;
            const dimensionsExact =
              readback.width === gxMipFractionalOracle.xfb.width &&
              readback.height === gxMipFractionalOracle.xfb.height;
            const acknowledgementExact =
              acknowledgedKeys.length === 1 &&
              acknowledgedKeys[0] === gxMipFractionalOracle.key;
            const diagnosticsAfter = rendererMetrics(
              renderer.diagnostics(),
            );
            const metricDelta = subtractMetrics(
              diagnosticsAfter,
              diagnosticsBefore,
            );
            const metricsExact = exactMetrics(
              metricDelta,
              gxMipFractionalOracle.expectedUpload,
            );
            cases.push({
              id: entry.id,
              lodSixteenths: entry.lodSixteenths,
              mipFractionSixteenths:
                entry.mipFractionSixteenths,
              mode0: entry.mode0,
              mode1: entry.mode1,
              expectedProbeRgba: entry.expectedProbeRgba,
              actualProbeRgba,
              expectedRgbaFnv1a64: entry.expectedRgbaFnv1a64,
              actualRgbaFnv1a64,
              nonUniformCoverageComparisonRgbaFnv1a64:
                entry.nonUniformCoverageComparisonRgbaFnv1a64,
              byteExact,
              probeExact,
              hashExact,
              coverageDiscriminatorExact,
              deterministic,
              dimensionsExact,
              acknowledgedKeys,
              acknowledgementExact,
              expectedMetrics: gxMipFractionalOracle.expectedUpload,
              metricDelta,
              metricsExact,
              width: readback.width,
              height: readback.height,
              presentation,
              pass:
                byteExact &&
                probeExact &&
                hashExact &&
                coverageDiscriminatorExact &&
                deterministic &&
                dimensionsExact &&
                acknowledgementExact &&
                metricsExact,
            });
          }
          const distinctProbeColors = new Set(
            cases.map(entry => entry.actualProbeRgba.join(",")),
          );
          const fractionalSequenceExact =
            distinctProbeColors.size ===
              gxMipFractionalOracleCases.length;
          runs.push({
            index: runIndex + 1,
            cases,
            fractionalSequenceExact,
            pass:
              fractionalSequenceExact &&
              cases.every(entry => entry.pass),
          });
        }

        const unexpectedCanvasContexts =
          contextTrace.requests.filter(type => type !== "webgpu");
        const backendDiagnostics = {
          renderer: "WebGpuRenderer",
          navigatorGpuAvailable:
            typeof navigator.gpu?.requestAdapter === "function",
          canvasContextRequests: [...contextTrace.requests],
          unexpectedCanvasContexts,
          strictWebGpuOnly:
            contextTrace.requests.length > 0 &&
            unexpectedCanvasContexts.length === 0 &&
            contextTrace.requests.every(type => type === "webgpu"),
        };
        renderer.check_health();
        const result = {
          pass:
            backendDiagnostics.navigatorGpuAvailable &&
            backendDiagnostics.strictWebGpuOnly &&
            runs.every(entry => entry.pass),
          runCount: RUN_COUNT,
          deterministic: runs
            .flatMap(entry => entry.cases)
            .every(entry => entry.deterministic),
          coordinate: gxMipFractionalOracle.coordinate,
          fixedCoordinate: gxMipFractionalOracle.fixedCoordinate,
          bilinearLevels: gxMipFractionalOracle.bilinearLevels,
          lodSixteenths: gxMipFractionalOracle.lodSixteenths,
          probe: gxMipFractionalOracle.probe,
          runs,
          backendDiagnostics,
          diagnostics: renderer.diagnostics(),
          limitation: gxMipFractionalOracle.limitation,
          health: "clean",
        };
        document.body.dataset.status = result.pass ? "pass" : "fail";
        document.querySelector("#result").textContent =
          JSON.stringify(result, null, 2);
        return result;
      } finally {
        renderer.free();
      }
    }

    window.__lazuliGxMipFractionalOraclePromise = run().catch(error => {
      const result = {
        pass: false,
        error: error instanceof Error ? error.stack : String(error),
      };
      document.body.dataset.status = "error";
      document.querySelector("#result").textContent =
        JSON.stringify(result, null, 2);
      return result;
    });
  </script>
</body>
</html>
