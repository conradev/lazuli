<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Lazuli XF clip-disable no-op WebGPU oracle</title>
  <style>
    :root {
      color-scheme: dark;
      font: 14px/1.5 ui-monospace, monospace;
      background: #0b0c0f;
      color: #f1f3f5;
    }
    body {
      margin: 2rem;
    }
    canvas {
      width: 64px;
      height: 64px;
      image-rendering: pixelated;
      border: 1px solid #59636e;
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
</head>
<body data-status="running">
  <h1>Lazuli XF clip-disable no-op WebGPU oracle</h1>
  <canvas id="oracle" width="4" height="4"></canvas>
  <pre id="result">running</pre>
  <script type="module">
    import init, {
      WebGpuRenderer,
    } from "../target/gekko-web/browser_renderer.js";
    import {
      IN_FRUSTUM_CLIP_DISABLE_MODES,
      IN_FRUSTUM_CLIP_DISABLE_VARIANT,
      evaluateInFrustumClipDisable,
    } from "./browser_boot_clip_disable_noop_oracle.mjs";
    import {
      buildVaryingRasterOraclePacket,
      varyingRasterOracleXfb,
    } from "./browser_boot_varying_raster_oracle.mjs";

    const RUN_COUNT = 2;

    async function present(renderer, generation) {
      const presentation = renderer.present_xfb(
        varyingRasterOracleXfb.destination,
        generation,
        0,
        "progressive",
        "top",
        generation,
        varyingRasterOracleXfb.width,
        varyingRasterOracleXfb.height,
        varyingRasterOracleXfb.stride,
        varyingRasterOracleXfb.height,
        1,
        false,
        false,
      );
      await renderer.drain();
      const readback = await renderer.read_presented_xfb_rgba();
      renderer.check_health();
      return { presentation, readback };
    }

    async function run() {
      await init();
      const canvas = document.querySelector("#oracle");
      const renderer = await WebGpuRenderer.create(canvas);
      renderer.reset_diagnostics();
      const runs = [];
      try {
        for (let runIndex = 0; runIndex < RUN_COUNT; runIndex += 1) {
          const cases = [];
          for (
            let modeIndex = 0;
            modeIndex < IN_FRUSTUM_CLIP_DISABLE_MODES.length;
            modeIndex += 1
          ) {
            const mode = IN_FRUSTUM_CLIP_DISABLE_MODES[modeIndex];
            const generation =
              runIndex * IN_FRUSTUM_CLIP_DISABLE_MODES.length +
              modeIndex +
              1;
            renderer.reset();
            const before = renderer.diagnostics();
            renderer.submit_gx_frame(
              buildVaryingRasterOraclePacket(
                IN_FRUSTUM_CLIP_DISABLE_VARIANT,
                generation,
                { xfClipDisable: mode },
              ),
            );
            const surface = await present(renderer, generation);
            const after = renderer.diagnostics();
            cases.push({
              ...evaluateInFrustumClipDisable(
                mode,
                before,
                after,
                surface.readback,
              ),
              presentation: surface.presentation,
            });
          }
          runs.push({
            index: runIndex + 1,
            pass: cases.every((entry) => entry.pass),
            cases,
          });
        }
        renderer.check_health();
        const diagnostics = renderer.diagnostics();
        const expectedManagedCoverage =
          RUN_COUNT * IN_FRUSTUM_CLIP_DISABLE_MODES.length;
        const aggregateCountersExact =
          diagnostics.exactRequiredRejectedDraws === 0 &&
          diagnostics.managedCoverageDraws === expectedManagedCoverage &&
          diagnostics.managedCoverageTriangles === expectedManagedCoverage;
        const result = {
          pass:
            runs.every((entry) => entry.pass) &&
            aggregateCountersExact,
          strictWebGpu: true,
          runCount: RUN_COUNT,
          modes: IN_FRUSTUM_CLIP_DISABLE_MODES,
          expectedManagedCoverage,
          aggregateCountersExact,
          runs,
          diagnostics,
          health: "clean",
        };
        document.body.dataset.status = result.pass ? "pass" : "fail";
        document.querySelector("#result").textContent =
          JSON.stringify(result, null, 2);
        return result;
      } finally {
        renderer.free();
      }
    }

    window.__lazuliClipDisableNoopOraclePromise =
      run().catch((error) => {
        const result = {
          pass: false,
          error: error instanceof Error ? error.stack : String(error),
        };
        document.body.dataset.status = "error";
        document.querySelector("#result").textContent =
          JSON.stringify(result, null, 2);
        return result;
      });
  </script>
</body>
</html>
